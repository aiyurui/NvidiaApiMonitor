# /etc/nginx/conf.d/nvidia-api-monitor.conf
# 用法：改成你的域名，然后 nginx -t && systemctl reload nginx
#
# 注意：下面这个 map 必须放在 http {} 作用域里。
# conf.d/*.conf 默认就是被 include 进 http{} 的，所以直接写在这里即可。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream nvidia-api-monitor_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name mon.example.com;

    # 配好证书后打开，把 http 永久跳转到 https
    # return 301 https://$host$request_uri;

    access_log /var/log/nginx/nvidia-api-monitor.access.log;
    error_log  /var/log/nginx/nvidia-api-monitor.error.log;

    # 后台「手动触发同步 / 全量健检」是长请求：
    # 一轮健检（3 批 × 30s 超时 + 批间 2s）最坏能到 ~95s，
    # 超时要留足，否则前端会看到 504。
    proxy_connect_timeout 10s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    location / {
        proxy_pass http://nvidia-api-monitor_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Next.js 的 HMR / SSE（dev 阶段用得到，生产开着也无害）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
    }

    # 静态资源长缓存（Next.js 产物带内容 hash，可以放心 immutable）
    location /_next/static/ {
        proxy_pass http://nvidia-api-monitor_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 60d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

